<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 20px;
         background: #0f1115; color: #e6e6e6; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  .logo { font-size: 26px; font-weight: 600; letter-spacing: 1px; }
  .logo span { color: #4d9fff; }
  .spinner { width: 36px; height: 36px; border: 3px solid #2a2f3a;
             border-top-color: #4d9fff; border-radius: 50%;
             animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { font-size: 13px; color: #8a93a3; }
  #extra { font-size: 12px; color: #5b6270; min-height: 16px; }
</style>
</head>
<body>
  <div class="logo">DeepSeek <span>Harness</span></div>
  <div class="spinner"></div>
  <div class="hint">正在启动…</div>
  <div id="extra"></div>
</body>
</html>
