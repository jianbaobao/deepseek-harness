# Build DeepSeek Harness install artifacts and publish them as a GitHub
# Release on this repository, modeled on the esengine/DeepSeek-Reasonix
# release shape:
#   - npm tarballs for every @deepseek-ai/* package (dsh + vendor families)
#   - a Windows portable zip (self-contained node_modules, no symlinks)
#
# Trigger on a dsh-v* / v* tag push, or manually with workflow_dispatch.
# Example: git tag dsh-v0.1.0-rc.5 && git push origin dsh-v0.1.0-rc.5
name: Build & Release Installers

on:
  push:
    tags: ['dsh-v*', 'v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack-npm:
    name: Pack npm tarballs
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build 2>&1 | tee build-errors.txt; exit ${PIPESTATUS[0]}
      - name: Upload build errors (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: build-errors.txt

      - name: Pack npm tarballs (dsh + vendor families)
        run: bash scripts/pack-all-tgz.sh dist/tgz

      - name: Resolve version
        id: version
        run: |
          REF="${{ github.ref }}"
          TAG="${REF#refs/tags/}"
          if [[ "$TAG" != "$REF" ]]; then
            VER="${TAG#dsh-v}"
            VER="${VER#v}"
          else
            VER="$(node -p "require('./apps/cli/package.json').version")"
            TAG="dsh-v${VER}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bundle npm tarballs into one archive
        run: |
          cd dist/tgz
          python3 -m zipfile -c "dsh-npm-packages-${{ steps.version.outputs.version }}.zip" *.tgz
          cd ../..
          ls -la dist/tgz/dsh-npm-packages-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/tgz/dsh-npm-packages-*.zip
          if-no-files-found: error

  installer-windows:
    name: Build Windows installer (exe + portable zip)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build 2>&1 | tee build-errors.txt; exit ${PIPESTATUS[0]}
      - name: Upload build errors (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: build-errors.txt

      - name: Pack npm tarballs (dsh + vendor families)
        run: bash scripts/pack-all-tgz.sh dist/tgz

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "$env:GITHUB_REF"
          if ($ref -like 'refs/tags/*') {
            $tag = $ref -replace '^refs/tags/', ''
            $ver = $tag -replace '^dsh-v', '' -replace '^v', ''
          } else {
            $ver = (Get-Content apps/cli/package.json | ConvertFrom-Json).version
            $tag = "dsh-v$ver"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download Node.js runtime (win-x64)
        shell: bash
        run: |
          mkdir -p dist/node-runtime dist/node-extract
          curl -sL -o dist/node-dist.zip "https://nodejs.org/dist/v24.16.0/node-v24.16.0-win-x64.zip"
          unzip -q dist/node-dist.zip -d dist/node-extract
          cp dist/node-extract/node-v24.16.0-win-x64/node.exe dist/node-runtime/
          ./dist/node-runtime/node.exe --version

      - name: Assemble portable directory (bundled Node)
        run: node scripts/package-portable.mjs . dist/windows-bundle --node-dir dist/node-runtime

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\innosetup.exe"
          Start-Process -FilePath "$env:TEMP\innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait

      - name: Build Windows installer (exe)
        shell: pwsh
        run: |
          $verInfo = "${{ steps.version.outputs.version }}" -replace '[^0-9.]', ''
          # Inno Setup 7 ships a native x64 build installed under Program Files
          # (not Program Files (x86)); locate ISCC.exe wherever it landed.
          $iscc = @(
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe',
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after Inno Setup install' }
          & $iscc /DMyAppVersion=${{ steps.version.outputs.version }} /DMyAppVersionInfo=$verInfo scripts/installer-windows.iss 2>&1 | Tee-Object -FilePath iscc-errors.txt
          exit $LASTEXITCODE
      - name: Upload ISCC errors (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iscc-errors
          path: iscc-errors.txt
      - name: Verify installer artifact
        if: success()
        run: Get-Item "dist/DeepSeek-Harness-${{ steps.version.outputs.version }}-setup.exe" | Select-Object Name, Length

      - name: Create Windows portable zip
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path dist/windows-bundle/* -DestinationPath "dsh-windows-x64-$ver.zip" -CompressionLevel Optimal

      - name: Build Desktop app (Electron, Reasonix-style window)
        shell: pwsh
        run: |
          # Bundle dsh (bundled Node + node_modules) as a tarball for the desktop app:
          # electron-builder excludes node_modules from extraResources, so the
          # app extracts the archive into userData on first launch.
          New-Item -ItemType Directory -Force -Path desktop/resources | Out-Null
          Remove-Item -Force desktop/resources/dsh-bundle.tar.gz -ErrorAction SilentlyContinue
          & 'C:\Windows\System32\tar.exe' -czf desktop/resources/dsh-bundle.tar.gz -C dist/windows-bundle .
          # Pin the desktop package version to the release version
          $pkg = Get-Content desktop/package.json -Raw
          $pkg = [regex]::Replace($pkg, '"version":\s*"[^"]*"', '"version": "${{ steps.version.outputs.version }}"')
          Set-Content desktop/package.json $pkg
          # Install Electron + builder and produce the desktop installers
          npm install --prefix desktop --no-audit --no-fund
          $env:ELECTRON_MIRROR = 'https://npmmirror.com/mirrors/electron/'
          npm run dist --prefix desktop
          Get-ChildItem dist/desktop/*.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/DeepSeek-Harness-*.exe
            dist/desktop/*.exe
            dsh-windows-x64-*.zip
          if-no-files-found: error

  installer-linux:
    name: Build Linux installer (deb)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build 2>&1 | tee build-errors.txt; exit ${PIPESTATUS[0]}
      - name: Upload build errors (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: build-errors.txt

      - name: Pack npm tarballs (dsh + vendor families)
        run: bash scripts/pack-all-tgz.sh dist/tgz

      - name: Resolve version
        id: version
        run: |
          REF="${{ github.ref }}"
          TAG="${REF#refs/tags/}"
          if [[ "$TAG" != "$REF" ]]; then
            VER="${TAG#dsh-v}"
            VER="${VER#v}"
          else
            VER="$(node -p "require('./apps/cli/package.json').version")"
            TAG="dsh-v${VER}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Node.js runtime (linux-x64)
        run: |
          mkdir -p dist/node-runtime dist/node-extract
          curl -sL -o dist/node-dist.tar.xz "https://nodejs.org/dist/v24.16.0/node-v24.16.0-linux-x64.tar.xz"
          tar -xf dist/node-dist.tar.xz -C dist/node-extract
          mkdir -p dist/node-runtime/bin
          cp dist/node-extract/node-v24.16.0-linux-x64/bin/node dist/node-runtime/bin/
          dist/node-runtime/bin/node --version

      - name: Assemble portable directory (bundled Node)
        run: node scripts/package-portable.mjs . dist/linux-bundle --node-dir dist/node-runtime

      - name: Build Debian package
        run: bash scripts/package-deb.sh ${{ steps.version.outputs.version }} dist/linux-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/deb/*.deb
          if-no-files-found: error

  installer-macos:
    name: Build macOS installer (dmg)
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build 2>&1 | tee build-errors.txt; exit ${PIPESTATUS[0]}
      - name: Upload build errors (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: build-errors.txt

      - name: Pack npm tarballs (dsh + vendor families)
        run: bash scripts/pack-all-tgz.sh dist/tgz

      - name: Resolve version
        id: version
        run: |
          REF="${{ github.ref }}"
          TAG="${REF#refs/tags/}"
          if [[ "$TAG" != "$REF" ]]; then
            VER="${TAG#dsh-v}"
            VER="${VER#v}"
          else
            VER="$(node -p "require('./apps/cli/package.json').version")"
            TAG="dsh-v${VER}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Node.js runtime (darwin)
        run: |
          case "$(uname -m)" in
            arm64)  NODE_ARCH=arm64 ;;
            x86_64) NODE_ARCH=x64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          mkdir -p dist/node-runtime dist/node-extract
          curl -sL -o dist/node-dist.tar.gz "https://nodejs.org/dist/v24.16.0/node-v24.16.0-darwin-$NODE_ARCH.tar.gz"
          tar -xf dist/node-dist.tar.gz -C dist/node-extract
          mkdir -p dist/node-runtime/bin
          cp "dist/node-extract/node-v24.16.0-darwin-$NODE_ARCH/bin/node" dist/node-runtime/bin/
          dist/node-runtime/bin/node --version

      - name: Assemble portable directory (bundled Node)
        run: node scripts/package-portable.mjs . dist/macos-bundle --node-dir dist/node-runtime

      - name: Build macOS dmg
        run: bash scripts/package-dmg.sh ${{ steps.version.outputs.version }} dist/macos-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [pack-npm, installer-windows, installer-linux, installer-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA256SUMS
        working-directory: artifacts
        run: |
          find . -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name '*.dmg' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Write latest.json
        run: |
          cat > latest.json <<EOF
          {
            "version": "${{ needs.pack-npm.outputs.version }}",
            "tag": "${{ needs.pack-npm.outputs.tag }}",
            "assets": {
              "windows": "dsh-windows-x64-${{ needs.pack-npm.outputs.version }}.zip",
              "windows-installer": "DeepSeek-Harness-${{ needs.pack-npm.outputs.version }}-setup.exe",
              "windows-desktop": "DeepSeek-Harness-${{ needs.pack-npm.outputs.version }}-desktop-setup.exe",
              "linux": "deepseek-harness_${{ needs.pack-npm.outputs.version }}_amd64.deb",
              "macos": "DeepSeek-Harness-${{ needs.pack-npm.outputs.version }}-macos.dmg"
            }
          }
          EOF

      - name: Compose release body (template + changelog)
        run: |
          VER="${{ needs.pack-npm.outputs.version }}"
          {
            echo "## DeepSeek Harness $VER"
            echo ""
            echo "### 本次更新 (from CHANGELOG.md)"
            # Extract the CHANGELOG section for this version (up to the next ##)
            awk -v v="## $VER" 'BEGIN{flag=0} /^## /{if(index($0,v)==1 && (length($0)==length(v) || substr($0,length(v)+1,1)==" ")){flag=1; next} else if(flag){exit}} flag{print}' CHANGELOG.md
            echo ""
            echo "### Installers (bundled Node.js runtime, no system Node required)"
            echo "- \`DeepSeek-Harness-$VER-setup.exe\` — Windows installer (Inno Setup, per-user, adds dsh to PATH)."
            echo "- \`deepseek-harness_${VER}_amd64.deb\` — Debian/Ubuntu package (\`sudo dpkg -i\`)."
            echo "- \`DeepSeek-Harness-$VER-macos.dmg\` — macOS disk image (run 安装.command to link dsh into ~/.local/bin)."
            echo ""
            echo "### Windows Desktop app (Electron window, Reasonix-style)"
            echo "- \`DeepSeek-Harness-$VER-desktop-setup.exe\` — desktop window app; bundles dsh + Node, opens the GUI in its own window (no browser)."
            echo ""
            echo "### Windows portable zip (no installer)"
            echo "- \`dsh-windows-x64-$VER.zip\` — unzip, then run \`dsh.cmd\` (bundled Node included)."
            echo ""
            echo "### npm packages archive"
            echo "All \`@deepseek-ai/*\` packages as npm tarballs, bundled into one archive:"
            echo "\`\`\`"
            echo "dsh-npm-packages-$VER.zip"
            echo "\`\`\`"
            echo "Unzip it, then install any package globally with \`npm i -g <file>.tgz\`, or add"
            echo "the tarball of \`@deepseek-ai/dsh\` to your project dependencies."
            echo ""
            echo "### Verify"
            echo "SHA256SUMS lists every artifact's checksum."
          } > release-body.md
          cat release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.pack-npm.outputs.tag }}
          name: DeepSeek Harness ${{ needs.pack-npm.outputs.version }}
          body_path: release-body.md
          files: |
            latest.json
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: false
